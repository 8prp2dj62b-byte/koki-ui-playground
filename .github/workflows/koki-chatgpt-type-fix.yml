name: KOKI ChatGPT Type Fix

on:
  push:
    branches:
      - feat/koki-chatgpt-app-v1
    paths:
      - '.github/workflows/koki-chatgpt-type-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/koki-chatgpt-app-v1
      - name: Normalize Json generics
        shell: bash
        run: |
          set -euo pipefail
          FILE=chatgpt-app/src/koki-client.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatgpt-app/src/koki-client.ts')
          s=p.read_text()
          s2=s.replace('this.functionRequest(FN.', 'this.functionRequest<Json>(FN.')
          if s2 == s:
              raise SystemExit('no replacements made')
          p.write_text(s2)
          PY
          git config user.name 'koki-rte'
          git config user.email 'koki-rte@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'fix(chatgpt): type live KOKI domain responses'
          git push origin HEAD:feat/koki-chatgpt-app-v1
