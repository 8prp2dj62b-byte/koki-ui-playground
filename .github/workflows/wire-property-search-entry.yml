name: Wire property search Buy entry

on:
  push:
    paths:
      - '.github/workflows/wire-property-search-entry.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inject isolated property-search loader
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          const tag = '<script src="./property-search/buy-entry.js"></script>';
          if (!html.includes(tag)) {
            if (!html.includes('</body>')) throw new Error('index.html has no </body>');
            html = html.replace('</body>', tag + '</body>');
            fs.writeFileSync(path, html);
          }
          NODE
      - name: Commit loader only
        run: |
          if git diff --quiet -- index.html; then
            echo 'Loader already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: add isolated imot.bg search entry to Buy'
          git push origin HEAD:${GITHUB_REF_NAME}
