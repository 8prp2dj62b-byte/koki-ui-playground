          test = r'''import assert from 'node:assert/strict';
import fs from 'node:fs';

function decide({inventoryOk,present,verifyStatus,remoteState}){
  if(!inventoryOk)return 'NO_CHANGE';
  if(present)return 'ACTIVE';
  if(verifyStatus===404)return 'DELETED_EXTERNAL';
  if(verifyStatus===200&&remoteState==='INACTIVE')return 'INACTIVE';
  if(verifyStatus===200)return 'ACTIVE';
  return 'UNKNOWN_EXTERNAL_STATE';
}

assert.equal(decide({inventoryOk:true,present:true,verifyStatus:null,remoteState:null}),'ACTIVE');
assert.equal(decide({inventoryOk:false,present:false,verifyStatus:404,remoteState:null}),'NO_CHANGE');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:404,remoteState:null}),'DELETED_EXTERNAL');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:500,remoteState:null}),'UNKNOWN_EXTERNAL_STATE');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:429,remoteState:null}),'UNKNOWN_EXTERNAL_STATE');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:0,remoteState:null}),'UNKNOWN_EXTERNAL_STATE');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:200,remoteState:'ACTIVE'}),'ACTIVE');
assert.equal(decide({inventoryOk:true,present:false,verifyStatus:200,remoteState:'INACTIVE'}),'INACTIVE');

const src=fs.readFileSync('supabase/functions/koki-takeover/index.ts','utf8');
