function remoteListingState(ad:any){const raw=String(ad?.status?.name||ad?.status||ad?.state||ad?.advert_status||'').toLowerCase();return['inactive','archived','expired','closed','removed','disabled'].some(x=>raw.includes(x))?'INACTIVE':'ACTIVE'}
