# interactive DOM-mirror bridge 2026-08-28 v2
name: Kleinanzeigen Bridge Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kleinanzeigen-bridge-trigger.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kleinanzeigen-browser-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Claim pending KOKI connection
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koki-kleinanzeigen-bridge"
          OIDC="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | jq -r '.value')"
          RESP="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC}" \
            -H 'Content-Type: application/json' \
            https://aqhdzfsspmuvadnlchvj.supabase.co/functions/v1/koki-command-center-staging-v30/claim)"
          SID="$(printf '%s' "$RESP" | jq -r '.session_id // empty')"
          echo "session_id=$SID" >> "$GITHUB_OUTPUT"
          if [ -n "$SID" ]; then echo 'Pending Kleinanzeigen login claimed.'; else echo 'No pending Kleinanzeigen login.'; fi

      - uses: actions/checkout@v4
        if: steps.claim.outputs.session_id != ''
        with:
          ref: integration/kleinanzeigen-browser-bridge

      - name: Install browser runtime
        if: steps.claim.outputs.session_id != ''
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start scraped login bridge
        if: steps.claim.outputs.session_id != ''
        shell: bash
        env:
          SESSION_ID: ${{ steps.claim.outputs.session_id }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 1
          CONTROL_TOKEN="$(openssl rand -hex 24)"
          export CONTROL_TOKEN CONTROL_PORT=6090
          node .github/kleinanzeigen-bridge.mjs >/tmp/ka-bridge.log 2>&1 &
          BRIDGE_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS -H "X-Control-Token: $CONTROL_TOKEN" http://127.0.0.1:6090/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -H "X-Control-Token: $CONTROL_TOKEN" http://127.0.0.1:6090/health >/dev/null
          /tmp/cloudflared tunnel --url http://127.0.0.1:6090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 40); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          test -n "${URL:-}"
          curl -fsS -X POST \
            -H "X-Control-Token: $CONTROL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"tunnel_url\":\"$URL\"}" \
            http://127.0.0.1:6090/configure >/dev/null
          wait $BRIDGE_PID
