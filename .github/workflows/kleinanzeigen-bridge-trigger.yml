name: Kleinanzeigen Bridge Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kleinanzeigen-bridge-trigger.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kleinanzeigen-browser-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Claim pending KOKI connection
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koki-kleinanzeigen-bridge"
          OIDC="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | jq -r '.value')"
          RESP="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC}" \
            -H 'Content-Type: application/json' \
            https://aqhdzfsspmuvadnlchvj.supabase.co/functions/v1/koki-command-center-staging-v30/claim)"
          SID="$(printf '%s' "$RESP" | jq -r '.session_id // empty')"
          echo "session_id=$SID" >> "$GITHUB_OUTPUT"
          if [ -n "$SID" ]; then echo 'Pending Kleinanzeigen login claimed.'; else echo 'No pending Kleinanzeigen login.'; fi

      - uses: actions/checkout@v4
        if: steps.claim.outputs.session_id != ''
        with:
          ref: integration/kleinanzeigen-browser-bridge

      - name: Install browser and remote desktop
        if: steps.claim.outputs.session_id != ''
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Start private browser bridge
        if: steps.claim.outputs.session_id != ''
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 1
          PW="$(openssl rand -hex 8)"
          x11vnc -storepasswd "$PW" /tmp/vncpass >/dev/null 2>&1
          x11vnc -display :99 -rfbauth /tmp/vncpass -forever -shared -bg -o /tmp/x11vnc.log >/dev/null 2>&1
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 >/tmp/novnc.log 2>&1 &
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 40); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          test -n "${URL:-}"
          echo "TUNNEL_URL=${URL}/vnc.html?autoconnect=true&resize=scale" >> "$GITHUB_ENV"
          echo "VNC_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run one-time Kleinanzeigen login
        if: steps.claim.outputs.session_id != ''
        env:
          SESSION_ID: ${{ steps.claim.outputs.session_id }}
        run: node .github/kleinanzeigen-bridge.mjs
