name: Wire grouped create menu

on:
  push:
    paths:
      - '.github/workflows/wire-create-menu.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inject create menu loader
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          const tag = '<script src="./property-search/create-menu.js"></script>';
          if (!html.includes(tag)) {
            const anchor = '<script src="./property-search/buy-entry.js"></script>';
            if (!html.includes(anchor)) throw new Error('property-search loader anchor missing');
            html = html.replace(anchor, anchor + tag);
            fs.writeFileSync(path, html);
          }
          NODE
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: load grouped create menu from plus'
          git push origin HEAD:${GITHUB_REF_NAME}
