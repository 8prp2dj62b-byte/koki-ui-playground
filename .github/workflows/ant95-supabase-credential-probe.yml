name: ANT95 Supabase Credential Probe

on:
  push:
    branches:
      - ant-95-koki-classifier-probe
    paths:
      - .github/workflows/ant95-supabase-credential-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check Supabase deploy credential presence
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN_MISSING"
            exit 2
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT"
