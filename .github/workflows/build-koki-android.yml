name: Build KOKI Android APK

on:
  push:
    paths:
      - 'android-shell/**'
      - '.github/workflows/build-koki-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-shell
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk out/KOKI-Android-v0.1.0-debug.apk
          sha256sum out/KOKI-Android-v0.1.0-debug.apk | tee out/KOKI-Android-v0.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOKI-Android-v0.1.0-debug
          path: out/*
          if-no-files-found: error
          retention-days: 14
