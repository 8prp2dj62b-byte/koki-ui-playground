name: KokiNative
options:
  bundleIdPrefix: eu.tonyshodling
  deploymentTarget:
    iOS: "17.0"
targets:
  KokiNative:
    type: application
    platform: iOS
    sources:
      - KokiNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.tonyshodling.koki.native
        PRODUCT_NAME: KOKI
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KOKI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
