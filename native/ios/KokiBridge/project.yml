name: KokiBridge
options:
  bundleIdPrefix: eu.tonyshodling
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  KokiBridge:
    type: application
    platform: iOS
    sources:
      - KokiBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.tonyshodling.kokibridge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KokiBridge/Info.plist
